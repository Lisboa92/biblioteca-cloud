server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — devolve index.html para qualquer rota não-ficheiro
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso: /api → container do backend (rede interna Docker)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
