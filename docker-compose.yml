# ─────────────────────────────────────────────────────────────────
# docker-compose.yml — Sistema de Gestão de Biblioteca
# Arquitectura de 3 camadas: Frontend (React+Nginx) → Backend (Node/Express) → BD (PostgreSQL)
# INFC-0015 · Computação na Nuvem · UTDEG · 2026
# ─────────────────────────────────────────────────────────────────
version: "3.9"

services:
  # ── CAMADA 3: Base de Dados (PostgreSQL 16) ─────────────────────
  database:
    image: postgres:16-alpine
    container_name: biblioteca_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - db_data:/var/lib/postgresql/data           # Volume p/ persistência
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - rede-app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── CAMADA 2: Backend (Node.js + Express — API REST) ────────────
  backend:
    build: ./backend
    container_name: biblioteca_api
    restart: unless-stopped
    environment:
      DB_HOST: database          # Resolução DNS interna (nome do serviço)
      DB_PORT: 5432
      DB_NAME: biblioteca
      DB_USER: admin
      DB_PASSWORD: admin123
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - rede-app

  # ── CAMADA 1: Frontend (React build servido por Nginx) ──────────
  frontend:
    build: ./frontend
    container_name: biblioteca_web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - rede-app

# ── Volumes nomeados (persistência fora do ciclo de vida do container)
volumes:
  db_data:

# ── Rede virtual privada para comunicação entre containers
networks:
  rede-app:
    driver: bridge
